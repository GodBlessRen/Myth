# 验证拓扑分层：质量门禁、跨平台 Runtime 与可选 MCP 各自给出独立证据，任一失败都阻止发布。
name: CI

on:
  push:
    branches: [main, "evolve/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Verify test discovery
        run: python scripts/check_test_discovery.py
      - name: Check Chinese guidance coverage
        run: python scripts/check_annotations.py
      - name: Check known secret patterns without printing values
        run: python scripts/audit_secret_patterns.py
      - name: Verify all Web scripts and discovered UI contracts
        run: node scripts/check_web.cjs

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    # Runtime 回归与说明门禁解耦：即使文档/静态门禁失败，也必须留下真实执行证据。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src tests scripts
      - name: Unit and crash-recovery tests
        run: python -m unittest discover -s tests -v

  mcp-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package with MCP v1 support
        run: python -m pip install -e ".[mcp]"
      # 真实启动仓库自带 stdio 服务；不是 mock，也不连接外部网络服务。
      - name: Verify Skill Hook and real local MCP handshake
        run: python -m unittest discover -s tests -p "test_extensions.py" -v

  release:
    needs: [quality, test, mcp-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build current wheel and source distribution
        run: |
          python -m pip install build
          python -m build
          git archive --format=zip --output=dist/myth-source.zip HEAD
          python scripts/validate_release.py dist
      - name: Validate installed wheel through real HTTP
        run: |
          python -m pip install dist/*.whl --target .runtime/wheel-installed
          python scripts/validate_package.py --package-dir .runtime/wheel-installed
      - name: Verify a fresh environment using only downloaded wheels
        run: |
          python -m pip download --dest dist/offline-wheels dist/*.whl build "setuptools>=68"
          python -m venv .runtime/offline-check
          .runtime/offline-check/bin/python -m pip install --no-index --find-links dist/offline-wheels dist/*.whl build setuptools
          PACKAGE_DIR=$(.runtime/offline-check/bin/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          .runtime/offline-check/bin/python scripts/validate_package.py --package-dir "$PACKAGE_DIR"
      # 仅留存已通过校验的发布物，不上传 checkout、.git、运行库或凭据；名称绑定精确提交。
      - name: Retain validated distributions for reproducible review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: myth-distributions-${{ github.sha }}
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/myth-source.zip
            dist/offline-wheels/*.whl
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          include-hidden-files: false
