[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "myth-runtime"
version = "0.8.0"
description = "A controllable evidence-first agent workbench over a durable execution kernel."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "GodBlessRen"}]
dependencies = []

[project.scripts]
myth = "myth.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
myth = ["webui/*.html", "webui/*.css", "webui/*.js"]
