# 四组合验证本机 SQLite/文件锁恢复语义；中文覆盖只检查说明存在，准确性仍靠审阅。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Check Chinese guidance coverage
        run: python scripts/check_annotations.py
      - name: Check Web JavaScript
        run: |
          node --check src/myth/webui/app.js
          node --check src/myth/webui/inspector.js
          node --check src/myth/webui/goals.js
      - name: Unit and crash-recovery tests
        run: python -m unittest discover -s tests -v
