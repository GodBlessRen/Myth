# 只对专用迁移分支写入生成物，绝不直接更新 main。
# 构建 job 不持有写入令牌；发布 job 不运行 npm/pip 或任何生成物脚本。
name: Vendor React 19 Preview
on:
  push:
    branches:
      - feat/react19-parity-release-gates-20261013
    paths:
      - 'frontend/**'
      - 'scripts/stage_react_preview.py'
      - 'src/myth/web_assets.py'
      - 'pyproject.toml'
      - '.github/workflows/vendor-react-preview.yml'
permissions:
  contents: read
concurrency:
  group: vendor-react-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Freeze dependency graph and install exact dependencies
        working-directory: frontend
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Typecheck and bundle same-origin workbench
        working-directory: frontend
        run: npm run build
      - name: Stage exact offline assets and lockfile
        run: |
          mkdir -p .work/react-vendor/frontend
          cp frontend/package-lock.json .work/react-vendor/frontend/package-lock.json
          python scripts/stage_react_preview.py --dist frontend/dist --out .work/react-vendor/src/myth/webui/react
      - uses: actions/upload-artifact@v4
        with:
          name: myth-react-vendor
          path: .work/react-vendor/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: myth-react-vendor
          path: .work/react-vendor/
      - name: Commit generated bytes to feature branch only
        run: |
          set -eu
          test "$GITHUB_REF_NAME" = "feat/react19-parity-release-gates-20261013"
          test "$GITHUB_EVENT_NAME" = "push"
          mkdir -p src/myth/webui/react
          for name in index.html workbench.js workbench.css manifest.json; do
            test -s ".work/react-vendor/src/myth/webui/react/$name"
            cp ".work/react-vendor/src/myth/webui/react/$name" "src/myth/webui/react/$name"
          done
          test -s .work/react-vendor/frontend/package-lock.json
          cp .work/react-vendor/frontend/package-lock.json frontend/package-lock.json
          git add frontend/package-lock.json src/myth/webui/react/
          if git diff --cached --quiet; then
            echo "Vendored assets already match exact source revision."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(react): vendor locked preview bytes and integrity manifest"
          git push origin "HEAD:$GITHUB_REF_NAME"
